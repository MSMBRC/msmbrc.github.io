<style>
  :root {
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Fraunces', Georgia, serif;
    --font-mono: 'Fraunces', ui-monospace, monospace;
    --max-width: 680px;
    --gutter: clamp(12px, 4vw, 16px);
    --nav-h: 56px;
    --hero-title-size: 64px;
  }

  html[data-theme="light"] {
    --bg: #ffffff;
    --bg-elevated: #F2F1EC;
    --text-primary: #17181A;
    --text-secondary: #55575C;
    --text-tertiary: #8A8C90;
    --border: #E2E1DA;
    --accent: #0D9488;
    --accent-text: #ffffff;
    --focus-ring: #0D9488;
  }

  html[data-theme="dark"] {
    --bg: #121314;
    --bg-elevated: #1B1C1E;
    --text-primary: #F2F2EF;
    --text-secondary: #A8AAAE;
    --text-tertiary: #74767A;
    --border: #2B2C2F;
    --accent: #2DD4C4;
    --accent-text: #0A1615;
    --focus-ring: #2DD4C4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: light dark; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-weight: 400;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background 0.25s ease, color 0.25s ease;
    min-height: 100vh;
    padding-top: var(--nav-h);
  }

  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: var(--accent-text); }
  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; border-radius: 2px; }

  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }

   
  .topnav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    height: var(--nav-h); background: var(--bg);
    padding: 0 var(--gutter);
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-display); font-weight: 500; font-size: 16px;
  }
  .topnav .logo a { font-weight: 500; }
  .topnav .logo a:hover { opacity: 0.8; }

  .theme-toggle {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg-elevated);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .theme-toggle:hover { border-color: var(--text-tertiary); transform: scale(1.05); }
  .theme-toggle svg { width: 15px; height: 15px; stroke: var(--text-primary); fill: none; stroke-width: 1.8; }
  .theme-toggle .icon-moon { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

   
  .hero { padding: clamp(48px, 9vw, 96px) var(--gutter) clamp(56px, 8vw, 96px); text-align: center; }
  .hero-title {
    font-family: var(--font-display); font-weight: 400; letter-spacing: -0.01em;
    line-height: 1.25; font-size: var(--hero-title-size);
    max-width: 22ch; margin: 0 auto;
  }

  main { padding-bottom: 40px; }

  .article-list { list-style: none; border-top: 1px solid var(--border); }
  .article-item { padding: 40px 0; border-bottom: 1px solid var(--border); }

  .article-date {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text-tertiary); display: block; margin-bottom: 10px;
  }

  .article-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; line-height: 1.3; margin-bottom: 16px; }
  a.article-title-link {
    background-image: linear-gradient(var(--accent), var(--accent));
    background-repeat: no-repeat; background-position: 0 100%; background-size: 0% 2px;
    transition: background-size 0.2s ease;
  }
  a.article-title-link:hover { background-size: 100% 2px; }

   
  .article-content { font-size: 18px; color: var(--text-primary); width: 100%; }
  .article-content p { margin-bottom: 1.1em; }
  .article-content img { max-width: 100%; height: auto; border-radius: 6px; margin: 1.2em 0; display: block; }
  .article-content video, .article-content iframe { max-width: 100%; border-radius: 6px; margin: 1.2em 0; }
  .article-content a { color: var(--accent); text-underline-offset: 3px; text-decoration: underline; }
  .article-content h1, .article-content h2, .article-content h3 { font-family: var(--font-display); font-weight: 700; margin: 1.4em 0 0.5em; }
  .article-content ul, .article-content ol { margin: 0 0 1.1em 1.3em; }
  .article-content blockquote { border-left: 2px solid var(--accent); padding-left: 16px; color: var(--text-secondary); margin: 1.1em 0; }
  .article-content code { font-family: var(--font-mono); font-size: 0.9em; background: var(--bg-elevated); padding: 2px 5px; border-radius: 4px; }
  .article-content pre { background: var(--bg-elevated); padding: 16px; border-radius: 8px; overflow-x: auto; margin: 1.1em 0; }
  .article-content pre code { background: none; padding: 0; }

  .pagination { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 48px 0 80px; font-family: var(--font-mono); font-size: 13px; }
  .page-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--text-secondary); transition: background 0.15s ease, color 0.15s ease; }
  a.page-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
  .page-btn.active { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .page-btn.arrow { font-size: 16px; }
  span.page-btn[aria-disabled="true"] { color: var(--border); }

  footer.site { border-top: 1px solid var(--border); padding: 28px 0 64px; font-size: 13px; color: var(--text-tertiary); display: flex; justify-content: space-between; }
  footer.site a:hover { color: var(--text-primary); }

  @media (max-width: 600px) {
    :root { --nav-h: 52px; --hero-title-size: 32px; }
    .hero { padding: 40px var(--gutter) 56px; }
    .article-title { font-size: 19px; }
  }
</style>
</head>
<body>

<nav class="topnav">
  <span class="logo"><a href="/">MSMBRC</a></span>
  <button class="theme-toggle" id="themeToggle" aria-label="Cambia tema">
    <svg class="icon-sun" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.6A9 9 0 1 1 11.4 3a7 7 0 0 0 9.6 9.6z"/></svg>
  </button>

    <div class="article-content"><p><img src="/uploads/20260829.webp" alt=""></p>
<p>Guybrush colored with watercolor, using a no-blending technique. Room for improvement, but it’s okay.</p>
</div>
  </article>
  <p style="margin-top:32px;"><a class="article-title-link" style="font-size:14px; color:var(--text-secondary);" href="/">← Tutti gli articoli</a></p>

  </main>

  <footer class="site">
    <span>© 2026 MSMBRC</span>
    <a href="/index.xml">RSS</a>
  </footer>
</div>

<script>
  const toggle = document.getElementById('themeToggle');
  const root = document.documentElement;
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  toggle.addEventListener('click', () => {
    const current = root.getAttribute('data-theme');
    root.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
  });
</script>

</body>
</html>
